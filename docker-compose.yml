version: '3.9'

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
      - node-modules-cache:/workspace/tools/agent-memory/dashboard/node_modules
      - ~/.agent-memory:/root/.agent-memory
    working_dir: /workspace
    command: sleep infinity
    environment:
      - CGO_ENABLED=1
      - AGENT_MEMORY_ENABLED=1
      - AGENT_MEMORY_OBSERVE_ENABLED=1
    ports:
      - "3210:3210"  # Dashboard
      - "8080:8080"  # API server

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
      - go-mod-cache:/go/pkg/mod
    working_dir: /workspace
    command: make test
    environment:
      - CGO_ENABLED=1

volumes:
  go-mod-cache:
  node-modules-cache:
