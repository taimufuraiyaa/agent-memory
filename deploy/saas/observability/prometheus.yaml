global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/prometheus-rules.yaml
  - /etc/prometheus/graph-alerts.yaml

scrape_configs:
  - job_name: agent-memory-api
    static_configs:
      - targets: ["api:8080"]
  - job_name: agent-memory-worker
    static_configs:
      - targets: ["worker:9090"]
  - job_name: agent-memory-reconciler
    static_configs:
      - targets: ["reconciler:9090"]
  - job_name: agent-memory-graph-worker
    static_configs:
      - targets: ["graph-worker:9090"]
