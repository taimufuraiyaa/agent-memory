  - full-and-incremental-canary
  - normalized-artifact-diff
  - shadow-quality-latency-and-cost
  - signed-immutable-image
  - staged-deployment-canary
  - prior-image-and-active-revision-rollback
configuration_rebuild_triggers: [adapter_version, graph_version, artifact_schema, prompt_fingerprint, model_route]
