[project]
name = "agent-memory-graphrag-adapter"
version = "0.1.0"
description = "Pinned Microsoft GraphRAG indexing adapter for Agent Memory"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "Agent Memory maintainers" }]
dependencies = [
  "cryptography==50.0.1",
  "graphrag==3.1.2",
]

[project.scripts]
agent-memory-graphrag = "agent_memory_graphrag.__main__:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_graphrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
