name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" -o agent-memory ./cmd/agent-memory
          tar -czf agent-memory_${{ github.ref_name }}_${{ matrix.target.goos }}_${{ matrix.target.goarch }}.tar.gz agent-memory
          shasum -a 256 agent-memory_${{ github.ref_name }}_${{ matrix.target.goos }}_${{ matrix.target.goarch }}.tar.gz > agent-memory_${{ github.ref_name }}_${{ matrix.target.goos }}_${{ matrix.target.goarch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agent-memory_${{ matrix.target.goos }}_${{ matrix.target.goarch }}
          path: |
            agent-memory_${{ github.ref_name }}_${{ matrix.target.goos }}_${{ matrix.target.goarch }}.tar.gz
            agent-memory_${{ github.ref_name }}_${{ matrix.target.goos }}_${{ matrix.target.goarch }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: flatten
        run: |
          mkdir -p release
          find dist -type f -maxdepth 2 -mindepth 2 -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
