name: hosted release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: hosted-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - agent-memory-api
          - agent-memory-worker
          - agent-memory-reconciler
          - agent-memory-migrate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve immutable image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Compute image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/saas/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    name: migrate and deploy staging
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve published image digests
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in api worker reconciler migrate; do
            image="$repository/agent-memory-$service"
            digest="$(docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --format '{{.Manifest.Digest}}')"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "registry returned an invalid digest for $service" >&2
              exit 1
            fi
            variable="AGENT_MEMORY_${service^^}_IMAGE"
            echo "$variable=$image@$digest" >> "$GITHUB_ENV"
          done
          echo "AGENT_MEMORY_RELEASE_ID=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: Configure staging cluster
        shell: bash
        env:
          KUBE_CONFIG_STAGING_B64: ${{ secrets.KUBE_CONFIG_STAGING_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG_STAGING_B64"
          printf '%s' "$KUBE_CONFIG_STAGING_B64" | base64 --decode > "$RUNNER_TEMP/agent-memory-kubeconfig"
          chmod 600 "$RUNNER_TEMP/agent-memory-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/agent-memory-kubeconfig" >> "$GITHUB_ENV"
          echo "AGENT_MEMORY_RELEASE_RECEIPT_PATH=$RUNNER_TEMP/agent-memory-staging-release-receipt.json" >> "$GITHUB_ENV"
          kubectl version --client

      - name: Validate, migrate, roll out, and health-gate
        run: scripts/saas-kubernetes-release.sh staging

      - name: Upload content-free staging release receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-release-receipt-${{ github.ref_name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-memory-staging-release-receipt.json
          if-no-files-found: error
          retention-days: 90
