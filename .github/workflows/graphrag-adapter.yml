name: graphrag adapter supply chain

on:
  pull_request:
    paths:
      - "tools/graphrag-adapter/**"
      - "cmd/agent-memory-graph-worker/**"
      - "internal/saas/graphworker/**"
      - "internal/saas/objectcustody/**"
      - ".github/workflows/graphrag-adapter.yml"
      - "deploy/saas/kubernetes/base/**"
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v7
        with:
          version: "0.12.1"
          enable-cache: false
      - name: Frozen tests and lock drift
        working-directory: tools/graphrag-adapter
        run: |
          uv lock --check
          uv run --frozen pytest
      - name: Graph worker supervisor tests
        run: go test ./cmd/agent-memory-graph-worker ./internal/saas/graphworker ./internal/saas/objectcustody
      - name: Resolve immutable build images
        id: base
        run: |
          python_digest="$(docker buildx imagetools inspect python:3.13.14-slim --format '{{.Manifest.Digest}}')"
          uv_digest="$(docker buildx imagetools inspect ghcr.io/astral-sh/uv:0.12.1 --format '{{.Manifest.Digest}}')"
          test "${python_digest#sha256:}" != "$python_digest"
          test "${uv_digest#sha256:}" != "$uv_digest"
          echo "python=python:3.13.14-slim@$python_digest" >> "$GITHUB_OUTPUT"
          echo "uv=ghcr.io/astral-sh/uv:0.12.1@$uv_digest" >> "$GITHUB_OUTPUT"
      - name: Build frozen wheelhouse
        working-directory: tools/graphrag-adapter
        env:
          PYTHON_IMAGE: ${{ steps.base.outputs.python }}
        run: make wheelhouse
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image without network dependency acquisition
        working-directory: tools/graphrag-adapter
        env:
          PYTHON_IMAGE: ${{ steps.base.outputs.python }}
          UV_IMAGE: ${{ steps.base.outputs.uv }}
          IMAGE: ghcr.io/${{ github.repository }}/agent-memory-graphrag-adapter:${{ github.sha }}
        run: make image container-test
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        if: github.event_name == 'pull_request'
        with:
          image: ghcr.io/${{ github.repository }}/agent-memory-graphrag-adapter:${{ github.sha }}
          format: cyclonedx-json
          output-file: tools/graphrag-adapter/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        if: github.event_name == 'pull_request'
        with:
          image: ghcr.io/${{ github.repository }}/agent-memory-graphrag-adapter:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          cosign-release: v3.1.2
      - name: Push and keyless-sign immutable image
        id: release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ghcr.io/${{ github.repository }}/agent-memory-graphrag-adapter:${{ github.sha }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/graphrag-adapter.yml@${{ github.ref }}
        run: |
          image="$IMAGE"
          docker push "$image"
          digest="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          repository="${image%:*}"
          release_image="$repository@$digest"
          cosign sign --yes "$release_image"
          cosign verify --output json "$release_image" --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer=https://token.actions.githubusercontent.com > tools/graphrag-adapter/signature-verification.json
          echo "image=$release_image" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        id: syft
        if: startsWith(github.ref, 'refs/tags/')
      - uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: grype
        if: startsWith(github.ref, 'refs/tags/')
      - name: Generate digest-bound SBOM, license, and vulnerability evidence
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          install -m 0755 "${{ steps.syft.outputs.cmd }}" "$RUNNER_TEMP/syft"
          install -m 0755 "${{ steps.grype.outputs.cmd }}" "$RUNNER_TEMP/grype"
          export PATH="$RUNNER_TEMP:$PATH"
          release_image="$RELEASE_IMAGE"
          syft "$release_image" --output cyclonedx-json=tools/graphrag-adapter/sbom.cdx.json
          grype "$release_image" --fail-on high --output json > tools/graphrag-adapter/vulnerabilities.json
          python3 tools/graphrag-adapter/scripts/supply_chain_evidence.py licenses \
            --sbom tools/graphrag-adapter/sbom.cdx.json \
            --output tools/graphrag-adapter/licenses.txt
      - name: Publish signed supply-chain evidence bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 tools/graphrag-adapter/scripts/supply_chain_evidence.py report \
            --release-commit "$GITHUB_SHA" \
            --image "$RELEASE_IMAGE" \
            --generated-at "$generated_at" \
            --lock tools/graphrag-adapter/uv.lock \
            --requirements tools/graphrag-adapter/requirements.lock \
            --sbom tools/graphrag-adapter/sbom.cdx.json \
            --licenses tools/graphrag-adapter/licenses.txt \
            --license-policy tools/graphrag-adapter/license-policy.json \
            --vulnerabilities tools/graphrag-adapter/vulnerabilities.json \
            --signature-verification tools/graphrag-adapter/signature-verification.json \
            --output tools/graphrag-adapter/supply-chain-report.json
          cosign sign-blob --yes \
            --bundle tools/graphrag-adapter/supply-chain-report.bundle.json \
            tools/graphrag-adapter/supply-chain-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: graphrag-adapter-supply-chain-${{ github.sha }}
          path: |
            tools/graphrag-adapter/sbom.cdx.json
            tools/graphrag-adapter/licenses.txt
            tools/graphrag-adapter/license-policy.json
            tools/graphrag-adapter/vulnerabilities.json
            tools/graphrag-adapter/signature-verification.json
            tools/graphrag-adapter/supply-chain-report.json
            tools/graphrag-adapter/supply-chain-report.bundle.json
          if-no-files-found: error
          retention-days: 90
